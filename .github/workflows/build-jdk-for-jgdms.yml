name: 'Build JDK for JGDMS'

# Produces a release linux-x64 JDK bundle for use by a JGDMS agent.
# The bundle is attached to a rolling GitHub Release (tag: dirty-chai-latest)
# so JGDMS agents can download it with a stable URL, and also uploaded as a
# workflow artifact for same-run consumption.

on:
  workflow_dispatch:
    inputs:
      configure-arguments:
        description: 'Additional configure arguments'
        required: false
      make-arguments:
        description: 'Additional make arguments'
        required: false

concurrency:
  group: rolling-release
  cancel-in-progress: false

jobs:
  build:
    name: 'Build linux-x64 release JDK'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: 'Checkout the JDK source'
        uses: actions/checkout@v4

      - name: 'Get the BootJDK'
        id: bootjdk
        uses: ./.github/actions/get-bootjdk
        with:
          platform: linux-x64

      - name: 'Get GTest'
        id: gtest
        uses: ./.github/actions/get-gtest

      - name: 'Install toolchain and dependencies'
        run: |
          sudo apt update
          sudo apt install -y --only-upgrade apt
          sudo apt install -y \
            gcc-13 \
            g++-13 \
            libasound2-dev \
            libcups2-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxrender-dev \
            libxt-dev \
            libxtst-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100 --slave /usr/bin/g++ g++ /usr/bin/g++-13

      - name: 'Configure'
        run: >
          bash configure
          --with-conf-name=linux-x64
          --with-debug-level=release
          --with-version-opt=${GITHUB_SHA::8}
          --with-boot-jdk=${{ steps.bootjdk.outputs.path }}
          --with-gtest=${{ steps.gtest.outputs.path }}
          --with-zlib=system
          --with-jmod-compress=zip-1
          --with-external-symbols-in-bundles=none
          --with-native-debug-symbols=none
          ${{ github.event.inputs.configure-arguments }} || (
          echo "Dumping config.log:" &&
          cat config.log &&
          exit 1)

      - name: 'Build product-bundles'
        id: build
        run: >
          make -k LOG=info product-bundles
          ${{ github.event.inputs.make-arguments }}
          || (bash ./.github/scripts/gen-build-failure-report.sh "$GITHUB_STEP_SUMMARY" && exit 1)

      - name: 'Check for build failure'
        run: |
          build_dir="$(find build -maxdepth 1 -mindepth 1 -type d | head -1)"
          if [[ -e $build_dir/build-failure ]]; then
            echo "Build failed — see summary for details."
            exit 1
          fi

      - name: 'Stage bundle'
        id: stage
        run: |
          bundle="$(find build -maxdepth 3 -name 'jdk-*_bin.tar.gz' | head -1)"
          if [[ -z "$bundle" ]]; then
            echo "ERROR: No JDK bundle found." >&2
            exit 1
          fi
          mkdir -p staging
          cp "$bundle" staging/jdk-linux-x64.tar.gz
          echo "bundle=staging/jdk-linux-x64.tar.gz" >> $GITHUB_OUTPUT
          sha256sum staging/jdk-linux-x64.tar.gz > staging/jdk-linux-x64.tar.gz.sha256
          echo "SHA256: $(awk '{print $1}' staging/jdk-linux-x64.tar.gz.sha256)"

      - name: 'Upload workflow artifact'
        uses: actions/upload-artifact@v4
        with:
          name: jdk-linux-x64
          path: staging/
          retention-days: 90

      - name: 'Delete existing rolling release (if present)'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dirty-chai-latest --yes 2>/dev/null || true
          git push --delete origin dirty-chai-latest 2>/dev/null || true

      - name: 'Create rolling GitHub Release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit_sha="${GITHUB_SHA::8}"
          gh release create dirty-chai-latest \
            --title "DirtyChai latest linux-x64 JDK (${commit_sha})" \
            --notes "Rolling release of the DirtyChai linux-x64 JDK bundle.

#This artifact is intended for JGDMS agents testing JGDMS on DirtyChai.

#**Built from commit:** \`${GITHUB_SHA}\`
#**SHA-256:** \`$(awk '{print $1}' staging/jdk-linux-x64.tar.gz.sha256)\`

#See [JGDMS_COMPATIBILITY.md](https://github.com/${{ github.repository }}/blob/trunk/JGDMS_COMPATIBILITY.md) for usage instructions." \
#            --prerelease \
#            staging/jdk-linux-x64.tar.gz \
#            staging/jdk-linux-x64.tar.gz.sha256
